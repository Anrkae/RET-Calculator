<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login | Painel Retenção</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <link rel="stylesheet" href="./src/css/pages/style.css">
</head>
<body>
  <div id="loginScreen" class="card fade-up">
    <span class="auth-kicker">RET Calculator</span>
    <h2>Acesso do Operador</h2>
    <p id="authSubtitle" class="auth-subtitle">Digite sua matrícula para continuar.</p>
    <p id="authFeedback" class="auth-feedback hidden"></p>

    <div class="auth-form">
      <label class="auth-label" for="matriculaInput">Matrícula</label>
      <input id="matriculaInput" placeholder="Ex.: 12345" autocomplete="username" inputmode="numeric">

      <label class="auth-label hidden" id="nameLabel" for="nameInput">Nome do operador</label>
      <input id="nameInput" class="hidden" placeholder="Como você quer aparecer no painel" autocomplete="name">

      <label class="auth-label hidden" id="passwordLabel" for="passwordInput">Senha</label>
      <input id="passwordInput" class="hidden" type="password" placeholder="Digite sua senha" autocomplete="current-password">
    </div>

    <button id="continueButton" class="primary" type="button">Continuar</button>
    <button id="backButton" class="ghost hidden" type="button">Voltar</button>
    <p class="auth-note">No primeiro acesso, vamos pedir seu nome e criar sua senha.</p>
  </div>

  <script src="./src/js/ui/animations.js"></script>
  <script type="module" src="./src/js/pages/login.js"></script>
</body>
</html>
