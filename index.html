<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Retenção</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="card fade-up">
    <h2>Login</h2>

    <input id="matriculaInput" placeholder="Matrícula">

    <button class="primary" onclick="login()">
      Entrar
    </button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <div class="card fade-up">
      <h2>Painel</h2>

      <div id="operatorInfo"></div>

      <button class="primary" onclick="openFloatingPanel()">
        Abrir painel
      </button>

      <!-- RESULTADOS -->
      <div class="resultados">
        <div class="stats-card">
          <div class="stats-number" id="statTotal">0</div>
          <div class="stats-label">Atendidas</div>
        </div>

        <div class="stats-card">
          <div class="stats-number" id="statRate">0%</div>
          <div class="stats-label">Taxa de desc.</div>
        </div>
      </div>

      <!-- HISTÓRICO -->
      <div class="history-section">
        <div class="history-header">
          <h3>Histórico de atendimentos</h3>

          <button
            id="toggleHistoryBtn"
            class="ghost hidden"
            type="button"
            onclick="toggleHistory()">
            Ver mais
          </button>
        </div>

        <div id="historyList" class="collapsed"></div>
      </div>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script src="style.js"></script>
  <script src="script.js"></script>

</body>
</html>
