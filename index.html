<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://securetoken.googleapis.com https://identitytoolkit.googleapis.com http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
  <title>Login | Painel Retenção</title>
  <link rel="icon" type="image/png" href="./assets/icon.png">
  <link rel="stylesheet" href="./src/css/pages/style.css">
</head>
<body class="auth-pending">
  <div id="loginScreen" class="card fade-up">
    <h2>Acesso do Operador</h2>
    <p id="authSubtitle" class="auth-subtitle">Digite seu ALMOPE para continuar.</p>
    <p id="authFeedback" class="auth-feedback hidden"></p>

    <div class="auth-form">
      <input id="matriculaInput" placeholder="Ex.: 12345" autocomplete="username" inputmode="numeric">

      <input id="nameInput" class="hidden" placeholder="Como se chama?" autocomplete="name">

      <input id="passwordInput" class="hidden" type="password" placeholder="Digite sua senha" autocomplete="current-password">
    </div>

    <button id="continueButton" class="primary" type="button">Continuar</button>
    <button id="backButton" class="ghost hidden" type="button">Voltar</button>
  </div>

  <script src="./src/js/ui/animations.js"></script>
  <script type="module" src="./src/js/pages/login.js"></script>
</body>
</html>
