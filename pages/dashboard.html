<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Retenção</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <link rel="stylesheet" href="../src/css/pages/style.css">
</head>
<body>
  <div id="dashboard" class="hidden">
    <div class="card fade-up">
      <div class="card-toolbar">
        <button id="logoutButton" class="ghost logout-button" type="button">Sair</button>
      </div>

      <h2>Painel</h2>

      <div id="operatorInfo"></div>

      <div class="dashboard-actions">
        <button id="openPipButton" class="primary" type="button">
          Abrir painel
        </button>
        <button id="openDemandButton" class="ghost action-button" type="button">
          Nova demanda
        </button>
      </div>

      <div class="resultados">
        <div class="stats-card">
          <div class="stats-number" id="statTotal">0</div>
          <div class="stats-label">Atendidas</div>
        </div>

        <div class="stats-card">
          <div class="stats-number" id="statRate">0%</div>
          <div class="stats-label">Taxa de desc.</div>
        </div>
      </div>

      <div class="history-section">
        <div class="history-header">
          <h3>Histórico de atendimentos</h3>

          <button id="toggleHistoryBtn" class="ghost hidden" type="button">
            <span class="toggle-history-icon" aria-hidden="true">
              <span class="toggle-history-bar toggle-history-bar-a"></span>
              <span class="toggle-history-bar toggle-history-bar-b"></span>
            </span>
            <span class="sr-only">Ver mais</span>
          </button>
        </div>

        <div id="historyList" class="collapsed"></div>
      </div>
    </div>
  </div>

  <div id="logoutModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="logoutModalTitle">
    <div class="modal-card fade-up">
      <h3 id="logoutModalTitle">Sair da sessão?</h3>
      <p class="modal-copy">Você será levado de volta para a tela de login.</p>
      <div class="modal-actions">
        <button id="cancelLogoutBtn" class="ghost" type="button">Cancelar</button>
        <button id="confirmLogoutBtn" class="primary" type="button">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="demandModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="demandModalTitle">
    <div class="modal-card fade-up demand-modal-card">
      <div class="demand-modal-header">
        <div>
          <h3 id="demandModalTitle">Nova demanda</h3>
          <p class="modal-copy">Selecione o tipo e preencha apenas os campos necessários.</p>
        </div>
        <button id="closeDemandModalBtn" class="ghost demand-close-button" type="button">Fechar</button>
      </div>

      <p id="demandFeedback" class="auth-feedback hidden"></p>

      <div class="demand-form">
        <label for="demandTypeSelect">Tipo de demanda</label>
        <select id="demandTypeSelect">
          <option value="">Selecione</option>
          <option value="encaixe-vt">Encaixe VT</option>
          <option value="retirar-ponto">Retirar Ponto Virtua</option>
          <option value="suspensao">Suspensão Temporária</option>
        </select>

        <div id="demandDynamicFields" class="demand-dynamic-fields hidden"></div>
      </div>

      <div class="modal-actions">
        <button id="cancelDemandBtn" class="ghost" type="button">Cancelar</button>
        <button id="submitDemandBtn" class="primary" type="button">Enviar demanda</button>
      </div>
    </div>
  </div>

  <script src="../src/js/ui/pip-snippet.js"></script>
  <script src="../src/js/ui/animations.js"></script>
  <script type="module" src="../src/js/pages/dashboard.js"></script>
</body>
</html>
