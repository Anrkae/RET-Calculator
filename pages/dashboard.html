<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel Retenção</title>
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <link rel="stylesheet" href="../src/css/pages/style.css">
</head>
<body>
  <div id="dashboard" class="hidden">
    <div class="card fade-up">
      <div class="card-toolbar">
        <div class="card-toolbar-actions">
          <button
            id="openPreferencesButton"
            class="icon-button preferences-gear-button"
            type="button"
            aria-label="Abrir preferências"
            title="Preferências"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19.14 12.94a7.96 7.96 0 0 0 .05-.94c0-.32-.02-.63-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.13.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.06.62-.06.94s.03.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.41 1.05.72 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.22 1.13-.53 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
            </svg>
          </button>
          <button id="logoutButton" class="ghost logout-button" type="button">Sair</button>
        </div>
      </div>

      <h2>Painel</h2>

      <div id="operatorInfo"></div>

      <div class="dashboard-actions">
        <button id="openPipButton" class="primary action-button" type="button">
          Abrir painel
        </button>
        <button id="openDemandButton" class="ghost action-button" type="button">
          Nova demanda
        </button>
      </div>

      <section id="dashboardOverviewTab">
        <div class="resultados">
          <div class="stats-card">
            <div class="stats-number" id="statTotal">0</div>
            <div class="stats-label">Atendidas</div>
          </div>

          <div class="stats-card">
            <div class="stats-number" id="statRate">0%</div>
            <div class="stats-label">Taxa de desc.</div>
          </div>
        </div>
      </section>

      <section id="dashboardOverviewHistoryTab">
        <div class="history-section">
          <div class="history-header">
            <h3>Histórico de atendimentos</h3>

            <button id="toggleHistoryBtn" class="ghost hidden" type="button">
              <span class="toggle-history-icon" aria-hidden="true">
                <span class="toggle-history-bar toggle-history-bar-a"></span>
                <span class="toggle-history-bar toggle-history-bar-b"></span>
              </span>
              <span class="sr-only">Ver mais</span>
            </button>
          </div>

          <div id="historyList" class="collapsed"></div>
        </div>
      </section>
    </div>
  </div>

  <div id="logoutModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="logoutModalTitle">
    <div class="modal-card fade-up">
      <h3 id="logoutModalTitle">Sair da sessão?</h3>
      <p class="modal-copy">Você será levado de volta para a tela de login.</p>
      <div class="modal-actions">
        <button id="cancelLogoutBtn" class="ghost" type="button">Cancelar</button>
        <button id="confirmLogoutBtn" class="primary" type="button">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="preferencesModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="preferencesModalTitle">
    <div class="modal-card fade-up preferences-modal-card">
      <div class="preferences-modal-header">
        <div>
          <h3 id="preferencesModalTitle">Preferências</h3>
          <p class="modal-copy">Ajustes pessoais da dashboard, salvos apenas neste navegador.</p>
        </div>
        <button id="closePreferencesModalBtn" class="ghost preferences-close-button" type="button">Fechar</button>
      </div>

      <div class="preferences-grid">
        <label class="preference-card" for="prefAutoOpenPip">
          <div class="preference-copy">
            <strong>Abrir PiP ao mudar de página</strong>
            <span>Quando ativo, o painel flutuante abre automaticamente ao sair da aba atual.</span>
          </div>
          <div class="preference-control">
            <span id="prefAutoOpenPipState" class="preference-state">Ativado</span>
            <input id="prefAutoOpenPip" type="checkbox" checked>
          </div>
        </label>

        <label class="preference-card" for="prefAskCancelObservation">
          <div class="preference-copy">
            <strong>Pedir observação no cancelamento</strong>
            <span>Depois de confirmar um cancelamento, abre uma etapa extra para observação antes do disparo.</span>
          </div>
          <div class="preference-control">
            <span id="prefAskCancelObservationState" class="preference-state">Desativado</span>
            <input id="prefAskCancelObservation" type="checkbox">
          </div>
        </label>

        <label class="preference-card" for="prefShowCancelContract">
          <div class="preference-copy">
            <strong>Mostrar contrato no cancelamento</strong>
            <span>Exibe o campo opcional de contrato durante a tabulação de cancelamento no painel flutuante.</span>
          </div>
          <div class="preference-control">
            <span id="prefShowCancelContractState" class="preference-state">Ativado</span>
            <input id="prefShowCancelContract" type="checkbox" checked>
          </div>
        </label>
      </div>
    </div>
  </div>

  <div id="demandModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="demandModalTitle">
    <div class="modal-card fade-up demand-modal-card">
      <div class="demand-modal-header">
        <div>
          <h3 id="demandModalTitle">Nova demanda</h3>
          <p class="modal-copy">Selecione o tipo e preencha apenas os campos necessários.</p>
        </div>
        <button id="closeDemandModalBtn" class="ghost demand-close-button" type="button">Fechar</button>
      </div>

      <p id="demandFeedback" class="auth-feedback hidden"></p>

      <div class="demand-form">
        <label for="demandTypeTrigger">Tipo de demanda</label>
        <div class="custom-select" id="demandTypeSelectWrap">
          <button id="demandTypeTrigger" class="custom-select-trigger" type="button" aria-expanded="false">
            <span id="demandTypeTriggerLabel">Selecione</span>
          </button>
          <div id="demandTypeMenu" class="custom-select-menu hidden" role="listbox">
            <button class="custom-select-option" type="button" data-demand-type-option="encaixe-vt">Encaixe VT</button>
            <button class="custom-select-option" type="button" data-demand-type-option="retirar-ponto">Retirar Ponto Virtua</button>
            <button class="custom-select-option" type="button" data-demand-type-option="suspensao">Suspensão Temporária</button>
          </div>
        </div>

        <div id="demandDynamicFields" class="demand-dynamic-fields hidden"></div>
      </div>

      <div class="modal-actions">
        <button id="cancelDemandBtn" class="ghost" type="button">Cancelar</button>
        <button id="submitDemandBtn" class="primary" type="button">Enviar demanda</button>
      </div>
    </div>
  </div>

  <script src="../src/js/ui/pip-snippet.js"></script>
  <script src="../src/js/ui/animations.js"></script>
  <script type="module" src="../src/js/pages/dashboard.js"></script>
</body>
</html>
